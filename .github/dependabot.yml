version: 2
updates:
  # Grouped so a bump wave arrives as ONE PR per ecosystem (not N conflicting ones).
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ["*"]
    # #[windows::core::implement] expands to ::windows_core paths, so windows-core is a direct
    # dependency. Its version must equal the windows-core that `windows` itself uses; a lone
    # windows-core bump links two copies and breaks the COM traits. Bump it with `windows` by hand.
    ignore:
      - dependency-name: windows-core
    commit-message:
      prefix: chore
    labels: [dependencies, rust]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
    labels: [dependencies, github-actions]
