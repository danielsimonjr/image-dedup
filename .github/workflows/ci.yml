name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Root crate: the PyO3 extension (dedup_core) that dedup_gui.py prefers.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Rust is preinstalled on ubuntu-latest; just ensure the lint components.
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      # --lib avoids building a test-harness binary, which a pyo3 extension-module
      # crate cannot link (libpython is resolved by the host at runtime, not built).
      - run: cargo clippy --lib -- -D warnings
      - run: cargo build --release --lib

  # Tauri v2 app crate (src-tauri) — the current GUI. Shares the algorithm code.
  tauri:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Tauri links these system libraries even for a --lib test binary. A stalled mirror
      # connection must time out and retry, not hold the runner: apt's own timeouts are long.
      - timeout-minutes: 15
        run: |
          APT="-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=5"
          sudo apt-get $APT update
          sudo apt-get $APT install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libxdo-dev
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --lib -- -D warnings
        working-directory: src-tauri
      # --lib only: the binary's generate_context!() needs a built frontend; the
      # library holds the algorithm + security tests we want to gate on.
      - run: cargo test --lib
        working-directory: src-tauri

  # Command-line tool (cli/): the reference implementation of the algorithm. Windows,
  # because recycle() and its Recycle Bin tests use IFileOperation, which is Windows-only.
  cli:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Python fallback engine (dedup_engine) + security tests.
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      # The test suite targets the pure-Python fallback engine (dedup_engine),
      # so only the fallback deps are needed — not the Rust extension.
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
