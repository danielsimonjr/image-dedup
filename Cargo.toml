[package]
name = "imgdedup"
version = "0.1.0"
edition = "2021"
description = "Command-line duplicate-image finder: pHash, dHash and SSIM; keeps the highest-resolution copy"
license = "MIT"
publish = false

[lib]
name = "imgdedup"
path = "src/lib.rs"

[[bin]]
name = "imgdedup"
path = "src/main.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "tiff", "webp"] }
rayon = "1.10"
walkdir = "2.5"
md-5 = "0.11"
hex = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_Foundation"] }
windows-core = "0.100"

[dev-dependencies]
tempfile = "3"

# The DCT and resize loops are unusably slow at opt-level 0; keep debug test runs short.
[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = false
strip = true
